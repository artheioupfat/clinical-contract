<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>clinical-contract | Data contracts for clinical data exchanges</title>
    <meta name="description" content="Rédigez, partagez et vérifiez des contrats de données cliniques avant l'échange de fichiers CSV ou Parquet." />
    <link rel="icon" href="./logo/phare.png" type="image/png" />
    <link rel="apple-touch-icon" href="./logo/phare.png" />
    <style>
      [x-cloak] {
        display: none !important;
      }
    </style>
    <link rel="stylesheet" href="./css/tailwind.css" />
    <script defer src="https://unpkg.com/alpinejs@3.14.9/dist/cdn.min.js"></script>
  </head>
  <body>
    <div x-data="landingPage()" x-init="init()" class="landing-root" :class="switchOn ? 'theme-dark' : ''">
      <header class="pine-header landing-header">
        <a class="pine-brand docs-brand-link" href="./index.html" :aria-label="t('common.brandHome')">
          <div class="pine-logo-box">
            <img src="./logo/phare.png" alt="Logo clinical-contract" class="pine-logo-image" />
          </div>
          <div class="pine-brand-row">
            <h1 class="pine-brand-title">clinical-contract</h1>
            <span class="pine-badge" x-text="siteVersionLabel" x-cloak></span>
          </div>
        </a>

        <nav class="docs-nav" :aria-label="t('common.nav.main')">
          <a href="./index.html" class="docs-nav-link docs-nav-link--active" aria-current="page" x-text="t('common.nav.home')"></a>
          <a href="./editor.html" class="docs-nav-link" x-text="t('common.nav.editor')"></a>
          <a href="./docs.html" class="docs-nav-link" x-text="t('common.nav.docs')"></a>
          <div class="locale-switch" :aria-label="t('common.language')" role="group" x-cloak>
            <button type="button" class="locale-switch__option" :class="{ 'locale-switch__option--active': locale === 'fr' }" @click="setLocale('fr')" :aria-pressed="locale === 'fr'">FR</button>
            <button type="button" class="locale-switch__option" :class="{ 'locale-switch__option--active': locale === 'en' }" @click="setLocale('en')" :aria-pressed="locale === 'en'">EN</button>
          </div>
          <a href="https://github.com/artheioupfat/clinical-contract" target="_blank" rel="noopener noreferrer" class="github-link" :aria-label="t('common.github')">
            <svg class="github-link__icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.59 2 12.253c0 4.528 2.865 8.371 6.839 9.728.5.094.683-.222.683-.494 0-.244-.009-.89-.014-1.747-2.782.62-3.369-1.375-3.369-1.375-.455-1.184-1.11-1.5-1.11-1.5-.908-.636.069-.623.069-.623 1.004.073 1.532 1.057 1.532 1.057.892 1.567 2.341 1.115 2.91.853.091-.662.35-1.115.636-1.371-2.221-.259-4.555-1.139-4.555-5.067 0-1.119.39-2.034 1.03-2.751-.103-.26-.446-1.303.098-2.715 0 0 .84-.276 2.75 1.051A9.377 9.377 0 0 1 12 6.958a9.38 9.38 0 0 1 2.504.345c1.909-1.327 2.747-1.051 2.747-1.051.546 1.412.203 2.455.1 2.715.64.717 1.028 1.632 1.028 2.751 0 3.938-2.337 4.805-4.566 5.059.359.317.679.943.679 1.9 0 1.371-.013 2.477-.013 2.814 0 .274.18.593.688.493C19.138 20.62 22 16.78 22 12.253 22 6.59 17.523 2 12 2Z" />
            </svg>
          </a>
          <button type="button" @click="toggleThemeSwitch()" class="pine-theme-button" :aria-label="switchOn ? t('common.themeLight') : t('common.themeDark')" x-cloak>
            <svg x-show="!switchOn" class="pine-theme-button__icon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <circle cx="12" cy="12" r="4.25" stroke="currentColor" stroke-width="1.8" />
              <path d="M12 2.75v2.1M12 19.15v2.1M4.15 4.15l1.5 1.5M18.35 18.35l1.5 1.5M2.75 12h2.1M19.15 12h2.1M4.15 19.85l1.5-1.5M18.35 5.65l1.5-1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
            </svg>
            <svg x-show="switchOn" class="pine-theme-button__icon pine-theme-button__icon--moon" viewBox="0 0 24 24" aria-hidden="true" fill="none">
              <path d="M20.05 14.7A7.45 7.45 0 0 1 9.3 3.95a8.2 8.2 0 1 0 10.75 10.75Z" stroke="#ffffff" stroke-width="1.9" stroke-linejoin="round" />
            </svg>
          </button>
        </nav>
      </header>

      <main>
        <section class="landing-hero">
          <div class="landing-hero__copy">
            <h2 style="text-transform: uppercase;">clinical-contract</h2>
            <p class="landing-kicker landing-kicker--under-title" x-text="t('landing.tagline')"></p>
            <div class="landing-actions">
              <a class="pine-btn pine-btn--action" href="./editor.html" x-text="t('landing.openEditor')"></a>
              <a class="pine-btn" href="./docs.html" x-text="t('landing.readDocs')"></a>
            </div>
          </div>
        </section>

        <section class="landing-visual-section" :aria-label="t('landing.visualAria')">
          <figure class="landing-visual-card">
            <img
              src="./logo/landing_page.png"
              :alt="t('landing.visualAlt')"
              class="landing-visual-image"
            />
          </figure>
        </section>

        <section class="landing-standard">
          <div class="landing-standard__intro">
            <p class="landing-kicker" x-text="t('landing.overviewKicker')"></p>
            <h3 x-text="t('landing.overviewTitle')"></h3>
            <p x-text="t('landing.overviewBody')"></p>
          </div>
          <div class="landing-standard__rows">
            <article>
              <span x-text="t('landing.contractTitle')"></span>
              <p x-text="t('landing.contractBody')"></p>
            </article>
            <article>
              <span x-text="t('landing.odcsTitle')"></span>
              <p>
                <span x-text="t('landing.odcsBeforeLink')"></span><a href="https://datacontract.com/" target="_blank" rel="noopener noreferrer" x-text="t('landing.odcsLink')"></a>.
              </p>
            </article>
            <article>
              <span x-text="t('landing.localTitle')"></span>
              <p x-text="t('landing.localBody')"></p>
            </article>
          </div>
        </section>

        <section class="landing-cli">
          <div class="landing-cli__copy">
            <p class="landing-kicker" x-text="t('landing.pythonKicker')"></p>
            <h3 x-text="t('landing.pythonTitle')"></h3>
            <p x-text="t('landing.pythonBody')"></p>
          </div>
          <div class="landing-cli__terminal">
            <div class="landing-cli__terminal-bar">
              <span></span>
              <span></span>
              <span></span>
              <strong x-text="t('landing.terminalLabel')"></strong>
            </div>
            <pre><code>uv tool install --python python3.11 clinical-contract

clinical-contract validate site/examples/clinical-template.yaml
clinical-contract check site/examples/clinical-template.yaml site/examples/clinical-template.parquet</code></pre>
          </div>
        </section>

        <section class="landing-closing">
          <p x-text="t('landing.closing')"></p>
          <a href="./docs.html" x-text="t('landing.closingLink')"></a>
        </section>
      </main>
    </div>

    <script src="./js/i18n.js"></script>
    <script src="./js/page-shell.js"></script>
    <script src="./js/site-version.js"></script>
    <script src="./js/landing.js"></script>
  </body>
</html>
