              <!-- Empty contract state: contract input is independent from the data checker. -->
              <template x-if="!schemaStarted">
                <div class="workspace-empty" @dragover.prevent @drop.prevent="dropYaml($event)">
                  <div class="workspace-empty-card">
                    <div class="workspace-empty-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.75h7.5L19 8.25v12H7v-16.5Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.5 3.75v4.5H19M9.5 13h7M9.5 16.5h5" />
                      </svg>
                    </div>
                    <h2 class="workspace-empty-title" x-text="t('editor.emptyContract.title')"></h2>
                    <p class="workspace-empty-copy" x-text="t('editor.emptyContract.body')"></p>
                    <div class="workspace-empty-actions">
                      <button type="button" class="pine-btn pine-btn--primary" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="startBlankContract()" x-text="t('editor.actions.newContract')"></button>
                      <button type="button" class="pine-btn" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="$refs.yamlInput.click()" x-text="t('editor.actions.loadContract')"></button>
                    </div>
                    <button type="button" class="workspace-template-link" :disabled="!pythonReady" @click="openContractTemplateModal()" x-text="t('editor.actions.showExamples')"></button>
                  </div>
                </div>
              </template>
