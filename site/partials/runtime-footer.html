        <!-- Footer: compact runtime status and editor metadata. -->
        <footer class="app-footer">
          <div class="footer-left">
            <span
              class="runtime-badge"
              x-show="!pythonReady || runtimeError"
              x-cloak
              :class="runtimeBadgeClass()"
              x-text="runtimeBadgeLabel()"
            ></span>
            <div class="footer-runtime-progress" x-show="showRuntimeProgress" x-transition.opacity.duration.250ms x-cloak>
              <div class="runtime-progress-track" role="progressbar" :aria-label="t('editor.footer.runtimeLoading')" aria-valuemin="0" aria-valuemax="100" :aria-valuenow="runtimeProgress">
                <span class="runtime-progress-fill" :style="`width:${runtimeProgress}%`"></span>
              </div>
              <span class="footer-runtime-progress__value" x-text="`${runtimeProgress}%`"></span>
            </div>
            <span class="footer-context" x-show="schemaStarted && !showRuntimeProgress" x-cloak>
              <strong x-text="t('editor.footer.contract')"></strong>
              <span class="footer-separator" aria-hidden="true">|</span>
              <span x-text="t('editor.footer.lines', { count: yamlText.split('\n').length })"></span>
            </span>
            <span
              class="footer-timings"
              x-show="!showRuntimeProgress && (validateDurationMs !== null || checkDurationMs !== null)"
              x-cloak
              :aria-label="t('editor.footer.times')"
            >
              <span x-show="validateDurationMs !== null">
                <strong x-text="t('editor.footer.validate')"></strong>
                <span x-text="formatExecutionDuration(validateDurationMs)"></span>
              </span>
              <span x-show="checkDurationMs !== null">
                <strong x-text="t('editor.footer.check')"></strong>
                <span x-text="formatExecutionDuration(checkDurationMs)"></span>
              </span>
            </span>
            <span class="footer-error" x-show="runtimeError" x-cloak x-text="runtimeError"></span>
          </div>
          <div class="footer-right" x-show="dataFile && !showRuntimeProgress" x-cloak>
            <strong x-text="t('editor.footer.dataFile')"></strong>
            <span class="footer-separator" aria-hidden="true">|</span>
            <span x-show="dataColumns !== null"><strong x-text="t('editor.footer.columns')"></strong> <span x-text="dataColumns"></span></span>
            <span x-show="dataRows !== null"><strong x-text="t('editor.footer.rows')"></strong> <span x-text="dataRows"></span></span>
            <span x-show="dataFileSize"><strong x-text="t('editor.footer.size')"></strong> <span x-text="formatFileSize(dataFileSize)"></span></span>
          </div>
        </footer>
