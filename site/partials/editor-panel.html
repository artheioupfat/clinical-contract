            <!-- Left panel: YAML editor plus visual contract builder. -->
            <section class="panel panel--editor">
              <div class="panel-head">
                <div>
                  <div class="panel-eyebrow" x-text="t('editor.panel.editor')"></div>
                  <div class="panel-title" x-text="yamlName || t('editor.panel.untitled')"></div>
                </div>
                <div class="pine-toolbar">
                  <div class="view-switch" :class="!schemaStarted ? 'view-switch--locked' : ''" :title="!schemaStarted ? t('editor.panel.unlockContract') : ''">
                    <button type="button" :class="editorModeButtonClass('schema')" @click="setEditorView('schema')" :disabled="!schemaStarted" x-text="t('editor.tabs.schema')"></button>
                    <button type="button" :class="editorModeButtonClass('yaml')" @click="setEditorView('yaml')" :disabled="!schemaStarted">YAML</button>
                    <button type="button" :class="editorModeButtonClass('validation')" @click="setEditorView('validation')" :disabled="!schemaStarted">
                      <span class="view-switch-label">
                        <span class="tab-dot" :class="tabDotClass(validateRunState)"></span>
                        <span x-text="t('editor.tabs.validation')"></span>
                      </span>
                    </button>
                  </div>
                  <input x-ref="yamlInput" type="file" class="sr-only" accept=".yaml,.yml" @change="importYaml($event)" />
                  <button
                    type="button"
                    @click="downloadYaml()"
                    :disabled="!schemaStarted || !yamlText.trim()"
                    class="pine-btn pine-btn--action-success pine-btn--icon"
                    :aria-label="t('editor.actions.download')"
                    :title="schemaStarted ? t('editor.actions.download') : t('editor.panel.unlockContract')"
                  >
                    <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v12m0 0 4-4m-4 4-4-4M5 21h14" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    x-show="schemaStarted"
                    x-cloak
                    @click.stop.prevent="resetContractModalOpen = true"
                    class="pine-btn pine-btn--danger pine-btn--icon"
                    :aria-label="t('editor.actions.reset')"
                    :title="t('editor.actions.resetQuestion')"
                  >
                    <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7" />
                    </svg>
                  </button>
                  <button type="button" @click="validateContract()" :disabled="busy || !pythonReady || !schemaStarted" class="pine-btn pine-btn--action" :class="!schemaStarted ? 'pine-btn--locked' : ''" :title="schemaStarted ? t('editor.actions.validateTitle') : t('editor.panel.unlockContract')" x-text="t('editor.actions.validate')"></button>
                </div>
              </div>

              <div
                x-show="editorStorageWarning"
                x-cloak
                class="schema-warning mx-4 mb-3"
                x-text="editorStorageWarning"
              ></div>

              <!-- Empty contract state: contract input is independent from the data checker. -->
              <template x-if="!schemaStarted">
                <div class="workspace-empty" @dragover.prevent @drop.prevent="dropYaml($event)">
                  <div class="workspace-empty-card">
                    <div class="workspace-empty-icon" aria-hidden="true">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M7 3.75h7.5L19 8.25v12H7v-16.5Z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M14.5 3.75v4.5H19M9.5 13h7M9.5 16.5h5" />
                      </svg>
                    </div>
                    <h2 class="workspace-empty-title" x-text="t('editor.emptyContract.title')"></h2>
                    <p class="workspace-empty-copy" x-text="t('editor.emptyContract.body')"></p>
                    <div class="workspace-empty-actions">
                      <button type="button" class="pine-btn pine-btn--primary" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="startBlankContract()" x-text="t('editor.actions.newContract')"></button>
                      <button type="button" class="pine-btn" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="$refs.yamlInput.click()" x-text="t('editor.actions.loadContract')"></button>
                    </div>
                    <button type="button" class="workspace-template-link" :disabled="!pythonReady" @click="openContractTemplateModal()" x-text="t('editor.actions.showExamples')"></button>
                  </div>
                </div>
              </template>

              <!-- YAML mode: plain code editor optimized for manual contract editing. -->
              <template x-if="schemaStarted && editorView === 'yaml'">
                <div class="editor-wrap" @dragover.prevent @drop.prevent="dropYaml($event)">
                  <div class="editor-gutter" aria-hidden="true">
                    <template x-for="line in lineNumbers" :key="line">
                      <div class="editor-line-number" x-text="line"></div>
                    </template>
                  </div>
                  <textarea
                    id="yaml-editor"
                    x-ref="yamlEditor"
                    x-model="yamlText"
                    @input="invalidateResultsFromYamlEditor()"
                    @input.debounce.350ms="syncSchemaFromYamlEditor()"
                    @scroll="syncEditorScroll($event)"
                    @keydown="handleEditorKeydown($event)"
                    spellcheck="false"
                    autocomplete="off"
                    autocorrect="off"
                    autocapitalize="off"
                    class="editor-textarea"
                    :placeholder="t('editor.emptyContract.placeholder')"
                  ></textarea>
                </div>
              </template>

              <!-- Schema mode: guided builder that keeps the YAML as the source of truth. -->
              <template x-if="schemaStarted && editorView === 'schema'">
                <div class="schema-editor">
                  <div
                    x-show="schemaParseWarning"
                    x-cloak
                    class="schema-warning"
                    x-text="schemaParseWarning"
                  ></div>

                  <div class="schema-workflow">
                    <!-- Builder navigation: high-level contract sections. -->
                    <aside class="schema-nav">
                      <div class="schema-nav-head">
                        <div class="schema-nav-title" x-text="t('editor.builder.title')"></div>
                      </div>

                      <nav class="schema-nav-list">
                        <template x-for="section in schemaSections" :key="`schema-section-${section.id}`">
                          <button type="button" :class="schemaSectionClass(section.id)" @click="setSchemaSection(section.id)">
                            <span class="schema-nav-copy">
                              <span class="schema-nav-item-title" x-text="t(section.titleKey)"></span>
                            </span>
                          </button>
                        </template>
                      </nav>

                   </aside>

                    <section class="schema-workspace">
                      <!-- Fundamentals: contract identity and business description. -->
                      <div class="schema-card schema-stage" x-show="schemaSection === 'fundamentals'" x-cloak>
                        <div class="schema-stage-bar">
                          <div>
                            <div class="schema-stage-title" x-text="t('editor.sections.fundamentals')"></div>
                          </div>
                        </div>
                        <div class="schema-business-stack">
                          <label class="schema-form-field">
                            <span class="schema-form-label"><span x-text="t('editor.builder.contractName')"></span> <span class="schema-required" x-show="showRequiredFor('name')" x-cloak x-text="t('common.required')"></span></span>
                            <input type="text" x-model="schemaDraft.name" @input.debounce.200ms="pushSchemaToYaml()" :class="requiredInputClass('name')" class="schema-input schema-form-control" />
                          </label>
                          <label class="schema-form-field">
                            <span class="schema-form-label"><span x-text="t('editor.builder.contractVersion')"></span> <span class="schema-required" x-show="showRequiredFor('version')" x-cloak x-text="t('common.required')"></span></span>
                            <input type="text" x-model="schemaDraft.version" @input.debounce.200ms="pushSchemaToYaml()" :class="requiredInputClass('version')" class="schema-input schema-form-control" />
                          </label>
                          <label class="schema-form-field schema-status-field">
                            <span class="schema-form-label" x-text="t('editor.builder.status')"></span>
                            <span class="schema-status-toggle">
                              <input
                                type="checkbox"
                                class="column-required-checkbox"
                                :checked="isContractActive()"
                                @change="setContractActive($event.target.checked)"
                              />
                              <span x-text="t('editor.builder.active')"></span>
                            </span>
                          </label>
                          <label class="schema-form-field schema-wide-field">
                            <span class="schema-form-label" x-text="t('editor.builder.purpose')"></span>
                            <textarea x-model="schemaDraft.descriptionPurpose" @input.debounce.250ms="pushSchemaToYaml()" rows="2" class="schema-input schema-form-control" :placeholder="t('editor.builder.purposePlaceholder')"></textarea>
                          </label>
                          <label class="schema-form-field schema-wide-field">
                            <span class="schema-form-label" x-text="t('editor.builder.usage')"></span>
                            <textarea x-model="schemaDraft.descriptionUsage" @input.debounce.250ms="pushSchemaToYaml()" rows="2" class="schema-input schema-form-control" :placeholder="t('editor.builder.usagePlaceholder')"></textarea>
                          </label>
                          <label class="schema-form-field schema-wide-field">
                            <span class="schema-form-label" x-text="t('editor.builder.limitations')"></span>
                            <textarea x-model="schemaDraft.descriptionLimitations" @input.debounce.250ms="pushSchemaToYaml()" rows="2" class="schema-input schema-form-control" :placeholder="t('editor.builder.limitationsPlaceholder')"></textarea>
                          </label>
                          <div class="schema-inline-grid schema-wide-field">
                            <label class="schema-form-field">
                              <span class="schema-form-label" x-text="t('editor.builder.studyStart')"></span>
                              <input type="date" x-model="schemaDraft.studyStartDate" @input.debounce.200ms="pushSchemaToYaml()" class="schema-input schema-form-control" />
                            </label>
                            <label class="schema-form-field">
                              <span class="schema-form-label" x-text="t('editor.builder.studyEnd')"></span>
                              <input type="date" x-model="schemaDraft.studyEndDate" @input.debounce.200ms="pushSchemaToYaml()" class="schema-input schema-form-control" />
                            </label>
                          </div>
                          <label class="schema-form-field">
                            <span class="schema-form-label" x-text="t('editor.builder.studyType')"></span>
                            <select x-model="schemaDraft.studyType" @change="pushSchemaToYaml()" class="schema-input schema-form-control">
                              <option value="" x-text="t('common.notSpecified')"></option>
                              <option value="cohort" x-text="t('editor.builder.studyTypes.cohort')"></option>
                              <option value="cross-sectional" x-text="t('editor.builder.studyTypes.crossSectional')"></option>
                              <option value="case-control" x-text="t('editor.builder.studyTypes.caseControl')"></option>
                              <option value="registry" x-text="t('editor.builder.studyTypes.registry')"></option>
                              <option value="clinical-trial" x-text="t('editor.builder.studyTypes.clinicalTrial')"></option>
                              <option value="retrospective" x-text="t('editor.builder.studyTypes.retrospective')"></option>
                              <option value="prospective" x-text="t('editor.builder.studyTypes.prospective')"></option>
                            </select>
                          </label>
                          <label class="schema-form-field">
                            <span class="schema-form-label" x-text="t('editor.builder.studyObjective')"></span>
                            <select x-model="schemaDraft.studyObjective" @change="pushSchemaToYaml()" class="schema-input schema-form-control">
                              <option value="" x-text="t('common.notSpecified')"></option>
                              <option value="predictive" x-text="t('editor.builder.objectives.predictive')"></option>
                              <option value="therapeutic" x-text="t('editor.builder.objectives.therapeutic')"></option>
                              <option value="diagnostic" x-text="t('editor.builder.objectives.diagnostic')"></option>
                              <option value="epidemiological" x-text="t('editor.builder.objectives.epidemiological')"></option>
                              <option value="descriptive" x-text="t('editor.builder.objectives.descriptive')"></option>
                              <option value="operational" x-text="t('editor.builder.objectives.operational')"></option>
                            </select>
                          </label>
                          <label class="schema-form-field schema-wide-field">
                            <span class="schema-form-label" x-text="t('editor.builder.healthDomain')"></span>
                            <input type="text" x-model="schemaDraft.healthDomain" @input.debounce.200ms="pushSchemaToYaml()" class="schema-input schema-form-control" :placeholder="t('editor.builder.healthPlaceholder')" />
                          </label>
                        </div>
                      </div>

                      <!-- Schema: table metadata and column definitions. -->
                      <div class="schema-card schema-stage" x-show="schemaSection === 'schema'" x-cloak>
                        <div class="schema-stage-bar">
                          <div>
                            <div class="schema-stage-title" x-text="t('editor.sections.schema')"></div>
                          </div>
                          <div class="pine-toolbar">
                            <label class="schema-form-field">
                              <span class="sr-only" x-text="t('editor.columns.table')"></span>
                              <select class="schema-input schema-form-control" :value="schemaActiveIndex" @change="selectSchemaTable($event.target.value)">
                                <template x-for="(table, index) in schemaCollection" :key="`schema-table-${index}`">
                                  <option :value="index" x-text="table.name || `${t('editor.columns.table')} ${index + 1}`"></option>
                                </template>
                              </select>
                            </label>
                            <button
                              type="button"
                              class="pine-btn pine-btn--icon"
                              @click="addSchemaTable()"
                              :aria-label="t('editor.columns.addTable')"
                              :title="t('editor.columns.addTable')"
                            >
                              <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                              </svg>
                            </button>
                            <button
                              type="button"
                              class="pine-btn pine-btn--danger pine-btn--icon"
                              @click="openRemoveTableModal()"
                              :aria-label="t('editor.columns.removeTable')"
                              :title="t('editor.columns.removeTable')"
                            >
                              <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7" />
                              </svg>
                            </button>
                          </div>
                        </div>
                        <div class="schema-form-grid schema-form-grid--schema">
                          <label class="schema-form-field">
                            <span class="schema-form-label"><span x-text="t('editor.columns.tableName')"></span> <span class="schema-required" x-show="showRequiredFor('tableName')" x-cloak x-text="t('common.required')"></span></span>
                            <input type="text" x-model="schemaDraft.tableName" @input.debounce.150ms="pushSchemaToYaml()" :class="requiredInputClass('tableName')" class="schema-input schema-form-control" />
                          </label>
                          <label class="schema-form-field">
                            <span class="schema-form-label"><span x-text="t('editor.columns.description')"></span> <span class="schema-required" x-show="showRequiredFor('tableDescription')" x-cloak x-text="t('common.required')"></span></span>
                            <input type="text" x-model="schemaDraft.tableDescription" @input.debounce.150ms="pushSchemaToYaml()" :class="requiredInputClass('tableDescription')" class="schema-input schema-form-control" />
                          </label>
                        </div>

                        <div class="schema-subsection-bar">
                          <div class="schema-stage-title" x-text="t('editor.columns.title')"></div>
                        </div>

                        <div class="column-list-shell mt-3">
                          <template x-if="schemaDraft.properties.length === 0">
                            <div class="column-empty" x-text="t('editor.columns.empty')"></div>
                          </template>
                          <table x-show="schemaDraft.properties.length > 0" x-cloak class="column-table">
                            <thead>
                              <tr>
                                <th x-text="t('editor.columns.column')"></th>
                                <th x-text="t('editor.columns.type')"></th>
                                <th x-text="t('editor.columns.required')"></th>
                                <th x-text="t('editor.columns.description')"></th>
                                <th class="text-right" x-text="t('editor.columns.action')"></th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="row in schemaDraft.properties" :key="row._rowId">
                                <tr class="column-table__row" @click="openSchemaProperty(row._rowId)" tabindex="0" @keydown.enter.prevent="openSchemaProperty(row._rowId)">
                                  <td class="column-table__column">
                                    <span x-text="row.name || t('editor.columns.unnamed')"></span>
                                    <span class="schema-required" x-show="showRequiredFor('propertyName', row)" x-cloak x-text="t('common.required')"></span>
                                  </td>
                                  <td class="column-table__type">
                                    <span x-text="columnTypeSummary(row)"></span>
                                  </td>
                                  <td class="column-table__required" x-text="row.required ? t('common.yes') : t('common.no')"></td>
                                  <td class="column-table__description" x-text="row.description || t('editor.columns.noDescription')"></td>
                                  <td class="column-table__action">
                                    <button type="button" class="column-edit-button" @click.stop.prevent="openSchemaProperty(row._rowId)" x-text="t('common.edit')"></button>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <div class="schema-add-row">
                          <button type="button" class="schema-add-btn" @click="addSchemaProperty()" x-text="t('editor.columns.add')"></button>
                        </div>
                      </div>

                      <template x-if="schemaEditorProperty()">
                        <div
                          class="entity-modal-backdrop"
                          @keydown.escape.window="closeSchemaProperty()"
                        >
                          <div class="entity-modal" x-data="{ row: schemaEditorProperty() }" @click.outside="closeSchemaProperty()">
                            <div class="entity-modal__header">
                              <div>
                                <div class="entity-modal__kicker" x-text="t('editor.columns.details')"></div>
                                <div class="entity-modal__title" x-text="row.name || t('editor.columns.unnamed')"></div>
                              </div>
                            </div>

                            <div class="entity-modal__body">
                              <label class="entity-modal__field">
                                <span class="entity-modal__label"><span x-text="t('editor.columns.name')"></span> <span class="schema-required" x-show="showRequiredFor('propertyName', row)" x-cloak x-text="t('common.required')"></span></span>
                                <input type="text" x-model="row.name" @input.debounce.150ms="pushSchemaToYaml()" :class="requiredInputClass('propertyName', row)" class="schema-input" placeholder="column_name" />
                              </label>

                              <label class="entity-modal__field column-required-field">
                                <span class="entity-modal__label" x-text="t('editor.columns.required')"></span>
                                <input type="checkbox" x-model="row.required" @change="pushSchemaToYaml()" class="column-required-checkbox" />
                              </label>

                              <label class="entity-modal__field">
                                <span class="entity-modal__label" x-text="t('editor.columns.logicalType')"></span>
                                <select
                                  :value="row.logicalType || ''"
                                  @change="row.logicalType = $event.target.value; onLogicalTypeChanged(row)"
                                  x-effect="row.logicalType; $nextTick(() => { $el.value = row.logicalType || '' })"
                                  class="schema-input"
                                >
                                  <option value="" x-text="t('editor.columns.noConstraint')"></option>
                                  <template x-for="logicalType in getLogicalTypeOptions(row)" :key="`logical-modal-${row._rowId}-${logicalType}`">
                                    <option :value="logicalType" x-text="logicalType"></option>
                                  </template>
                                </select>
                              </label>

                              <label class="entity-modal__field" x-show="shouldShowPhysicalType(row)" x-cloak>
                                <span class="entity-modal__label" x-text="t('editor.columns.physicalType')"></span>
                                <select
                                  :value="row.physicalType || ''"
                                  @change="row.physicalType = $event.target.value; onPhysicalTypeChanged(row)"
                                  x-effect="row.physicalType; $nextTick(() => { $el.value = row.physicalType || '' })"
                                  class="schema-input"
                                >
                                  <option value="" x-text="t('common.notSpecified')"></option>
                                  <template x-for="physicalType in getPhysicalTypeOptions(row)" :key="`physical-modal-${row._rowId}-${physicalType}`">
                                    <option :value="physicalType" x-text="physicalType"></option>
                                  </template>
                                </select>
                              </label>

                              <label class="entity-modal__field entity-modal__field--wide column-description-field">
                                <span class="entity-modal__label" x-text="t('editor.columns.description')"></span>
                                <textarea x-model="row.description" @input.debounce.150ms="pushSchemaToYaml()" rows="5" class="schema-input schema-input--description column-description-textarea" :placeholder="t('editor.columns.descriptionPlaceholder')"></textarea>
                              </label>

                              <label class="entity-modal__field entity-modal__field--wide">
                                <span class="entity-modal__label" x-text="t('editor.columns.examples')"></span>
                                <textarea x-model="row.examplesText" @input.debounce.150ms="pushSchemaToYaml()" rows="3" class="schema-input schema-input--description" :placeholder="t('editor.columns.examplesPlaceholder')"></textarea>
                              </label>
                            </div>

                            <div class="entity-modal__footer">
                              <button type="button" class="entity-modal__remove" @click="removeSchemaProperty(row._rowId)" x-text="t('editor.columns.remove')"></button>
                              <button type="button" class="pine-btn pine-btn--primary" @click="closeSchemaProperty()" x-text="t('common.done')"></button>
                            </div>
                          </div>
                        </div>
                      </template>

                      <!-- Quality: SQL checks attached to contract columns. -->
                      <div class="schema-card schema-stage" x-show="schemaSection === 'quality'" x-cloak>
                        <div class="schema-stage-bar">
                          <div>
                            <div class="schema-stage-title" x-text="t('editor.sections.quality')"></div>
                          </div>
                          <label class="schema-form-field">
                            <span class="sr-only" x-text="t('editor.columns.table')"></span>
                            <select class="schema-input schema-form-control" :value="schemaActiveIndex" @change="selectSchemaTable($event.target.value)">
                              <template x-for="(table, index) in schemaCollection" :key="`quality-table-${index}`">
                                <option :value="index" x-text="table.name || `${t('editor.columns.table')} ${index + 1}`"></option>
                              </template>
                            </select>
                          </label>
                        </div>
                        <div class="quality-list-shell">
                          <template x-if="schemaDraft.qualityRules.length === 0">
                            <div class="quality-empty" x-text="t('editor.quality.empty')"></div>
                          </template>
                          <table x-show="schemaDraft.qualityRules.length > 0" x-cloak class="quality-table">
                            <thead>
                              <tr>
                                <th x-text="t('editor.quality.column')"></th>
                                <th x-text="t('editor.quality.description')"></th>
                                <th class="text-right" x-text="t('editor.quality.action')"></th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="rule in schemaDraft.qualityRules" :key="rule._rowId">
                                <tr class="quality-table__row" @click="openQualityRule(rule._rowId)" tabindex="0" @keydown.enter.prevent="openQualityRule(rule._rowId)">
                                  <td class="quality-table__column" x-text="rule.propertyName || t('editor.quality.noColumn')"></td>
                                  <td class="quality-table__description" x-text="rule.description || t('editor.quality.untitled')"></td>
                                  <td class="quality-table__action">
                                    <button type="button" class="quality-edit-button" @click.stop.prevent="openQualityRule(rule._rowId)" x-text="t('common.edit')"></button>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <div class="schema-add-row">
                          <button type="button" class="schema-add-btn" @click="addQualityRule()" :disabled="!schemaDraft.properties.some((property) => property.name)" x-text="t('editor.quality.add')"></button>
                        </div>
                      </div>

                      <template x-if="qualityEditorRule()">
                        <div
                          class="entity-modal-backdrop"
                          @keydown.escape.window="closeQualityRule()"
                        >
                          <div class="entity-modal" x-data="{ rule: qualityEditorRule() }" @click.outside="closeQualityRule()">
                            <div class="entity-modal__header">
                              <div>
                                <div class="entity-modal__kicker" x-text="t('editor.quality.details')"></div>
                                <div class="entity-modal__title" x-text="rule.description || t('editor.quality.untitled')"></div>
                              </div>
                            </div>

                            <div class="entity-modal__body">
                              <label class="entity-modal__field">
                                <span class="entity-modal__label" x-text="t('editor.quality.column')"></span>
                                <select
                                  x-ref="qualityColumnSelect"
                                  :value="rule.propertyName || ''"
                                  x-init="$nextTick(() => { $refs.qualityColumnSelect.value = rule.propertyName || '' })"
                                  @change="
                                    setQualityRuleProperty(rule, $event.target.value);
                                    $nextTick(() => { $refs.qualityColumnSelect.value = rule.propertyName || '' });
                                  "
                                  class="schema-input"
                                >
                                  <template x-for="property in schemaDraft.properties" :key="`entity-modal-property-${rule._rowId}-${property._rowId}`">
                                    <option
                                      :value="property.name"
                                      :selected="property.name === rule.propertyName"
                                      x-text="property.name || t('editor.columns.unnamed')"
                                    ></option>
                                  </template>
                                </select>
                              </label>

                              <div class="quality-comparison">
                                <label class="entity-modal__field">
                                  <span class="entity-modal__label" x-text="t('editor.quality.comparison')"></span>
                                  <select x-model="rule.comparisonOperator" @change="pushSchemaToYaml()" class="schema-input">
                                    <option value="equal" x-text="t('editor.quality.operators.equal')"></option>
                                    <option value="notEqual" x-text="t('editor.quality.operators.notEqual')"></option>
                                    <option value="greaterThan" x-text="t('editor.quality.operators.greaterThan')"></option>
                                    <option value="greaterThanOrEqual" x-text="t('editor.quality.operators.greaterThanOrEqual')"></option>
                                    <option value="lessThan" x-text="t('editor.quality.operators.lessThan')"></option>
                                    <option value="lessThanOrEqual" x-text="t('editor.quality.operators.lessThanOrEqual')"></option>
                                    <option value="between" x-text="t('editor.quality.operators.between')"></option>
                                  </select>
                                </label>

                                <label class="entity-modal__field" x-show="rule.comparisonOperator !== 'between'">
                                  <span class="entity-modal__label" x-text="t('editor.quality.expected')"></span>
                                  <input type="number" step="any" x-model.number="rule.expectedValue" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input" />
                                </label>

                                <div class="quality-comparison__range" x-show="rule.comparisonOperator === 'between'" x-cloak>
                                  <label class="entity-modal__field">
                                    <span class="entity-modal__label" x-text="t('editor.quality.minimum')"></span>
                                    <input type="number" step="any" x-model.number="rule.expectedMin" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input" />
                                  </label>
                                  <label class="entity-modal__field">
                                    <span class="entity-modal__label" x-text="t('editor.quality.maximum')"></span>
                                    <input type="number" step="any" x-model.number="rule.expectedMax" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input" />
                                  </label>
                                </div>
                              </div>

                              <label class="entity-modal__field entity-modal__field--wide">
                                <span class="entity-modal__label" x-text="t('editor.quality.description')"></span>
                                <textarea x-model="rule.description" @input.debounce.150ms="pushSchemaToYaml()" rows="3" class="schema-input schema-input--description quality-description-textarea" :placeholder="t('editor.quality.descriptionPlaceholder')"></textarea>
                              </label>

                              <label class="entity-modal__field entity-modal__field--wide">
                                <span class="entity-modal__label" x-text="t('editor.quality.sqlQuery')"></span>
                                <div class="quality-sql-editor">
                                  <div class="quality-sql-editor__bar">
                                    <span x-text="t('editor.quality.duckdbSql')"></span>
                                    <span class="quality-sql-editor__table-hint">
                                      <span class="quality-sql-editor__table-label" x-text="t('editor.quality.tableName')"></span>
                                      <span class="quality-sql-editor__table-name" x-text="schemaDraft.tableName || 'data'"></span>
                                    </span>
                                  </div>
                                  <textarea x-model="rule.query" @input.debounce.200ms="pushSchemaToYaml()" rows="8" class="quality-sql-editor__textarea" spellcheck="false" :placeholder="t('editor.quality.sqlPlaceholder')"></textarea>
                                </div>
                              </label>
                            </div>

                            <div class="entity-modal__footer">
                              <button type="button" class="entity-modal__remove" @click="removeQualityRule(rule._rowId)" x-text="t('editor.quality.remove')"></button>
                              <button type="button" class="pine-btn pine-btn--primary" @click="closeQualityRule()" x-text="t('common.done')"></button>
                            </div>
                          </div>
                        </div>
                      </template>

                      <!-- Team: ownership metadata and members. -->
                      <div class="schema-card schema-stage" x-show="schemaSection === 'team'" x-cloak>
                        <div class="schema-stage-bar">
                          <div>
                            <div class="schema-stage-title" x-text="t('editor.sections.team')"></div>
                          </div>
                        </div>
                        <div class="schema-form-grid schema-form-grid--two">
                          <label class="schema-form-field">
                            <span class="schema-form-label" x-text="t('editor.team.name')"></span>
                            <input type="text" x-model="schemaDraft.teamName" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input schema-form-control" />
                          </label>
                          <label class="schema-form-field">
                            <span class="schema-form-label" x-text="t('editor.team.description')"></span>
                            <input type="text" x-model="schemaDraft.teamDescription" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input schema-form-control" />
                          </label>
                        </div>
                        <div class="schema-subsection-bar">
                          <div class="schema-stage-title" x-text="t('editor.team.members')"></div>
                        </div>
                        <div class="team-list-shell mt-3">
                          <template x-if="schemaDraft.teamMembers.length === 0">
                            <div class="team-empty" x-text="t('editor.team.empty')"></div>
                          </template>
                          <table x-show="schemaDraft.teamMembers.length > 0" x-cloak class="team-table">
                            <thead>
                              <tr>
                                <th x-text="t('editor.team.memberName')"></th>
                                <th x-text="t('editor.team.role')"></th>
                                <th class="text-right" x-text="t('editor.team.action')"></th>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-for="member in schemaDraft.teamMembers" :key="member._rowId">
                                <tr class="team-table__row" @click="openTeamMember(member._rowId)" tabindex="0" @keydown.enter.prevent="openTeamMember(member._rowId)">
                                  <td class="team-table__name" x-text="member.name || t('editor.team.unnamed')"></td>
                                  <td class="team-table__role" x-text="member.role || t('editor.team.noRole')"></td>
                                  <td class="team-table__action">
                                    <button type="button" class="team-edit-button" @click.stop.prevent="openTeamMember(member._rowId)" x-text="t('common.edit')"></button>
                                  </td>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <div class="schema-add-row">
                          <button type="button" class="schema-add-btn" @click="addTeamMember()" x-text="t('editor.team.add')"></button>
                        </div>
                      </div>

                      <template x-if="teamEditorMember()">
                        <div
                          class="entity-modal-backdrop"
                          @keydown.escape.window="closeTeamMember()"
                        >
                          <div class="entity-modal" x-data="{ member: teamEditorMember() }" @click.outside="closeTeamMember()">
                            <div class="entity-modal__header">
                              <div>
                                <div class="entity-modal__kicker" x-text="t('editor.team.details')"></div>
                                <div class="entity-modal__title" x-text="member.name || t('editor.team.unnamed')"></div>
                              </div>
                            </div>

                            <div class="entity-modal__body">
                              <label class="entity-modal__field">
                                <span class="entity-modal__label" x-text="t('editor.team.memberName')"></span>
                                <input type="text" x-model="member.name" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input team-member-input" :placeholder="t('editor.team.namePlaceholder')" />
                              </label>

                              <label class="entity-modal__field">
                                <span class="entity-modal__label" x-text="t('editor.team.role')"></span>
                                <input type="text" x-model="member.role" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input team-member-input" :placeholder="t('editor.team.rolePlaceholder')" />
                              </label>

                              <label class="entity-modal__field entity-modal__field--wide">
                                <span class="entity-modal__label" x-text="t('editor.team.email')"></span>
                                <input type="email" x-model="member.email" @input.debounce.150ms="pushSchemaToYaml()" class="schema-input team-member-input" placeholder="jane.doe@example.org" />
                              </label>
                            </div>

                            <div class="entity-modal__footer">
                              <button type="button" class="entity-modal__remove" @click="removeTeamMember(member._rowId)" x-text="t('editor.team.remove')"></button>
                              <button type="button" class="pine-btn pine-btn--primary" @click="closeTeamMember()" x-text="t('common.done')"></button>
                            </div>
                          </div>
                        </div>
                      </template>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Validation mode: contract-only structure validation results. -->
              <template x-if="schemaStarted && editorView === 'validation'">
                <div class="results-shell results-shell--standalone">
                  <div class="results-table-wrap">
                    <table class="results-table">
                      <thead>
                        <tr>
                          <th x-text="t('editor.validation.field')"></th>
                          <th x-text="t('editor.validation.status')"></th>
                          <th x-text="t('editor.validation.value')"></th>
                        </tr>
                      </thead>
                      <tbody>
                        <template x-if="validateRows.length === 0">
                          <tr><td colspan="3" class="empty-row" x-text="t('editor.validation.empty')"></td></tr>
                        </template>
                        <template x-for="row in validateRows" :key="row.field">
                          <tr>
                            <td x-text="row.field"></td>
                            <td>
                              <span class="status-chip" :class="statusChipClass(row.status)">
                                <span class="status-dot" :class="statusDotClass(row.status)"></span>
                                <span x-text="resultStatusLabel(row.status)"></span>
                              </span>
                            </td>
                            <td x-text="row.value"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
                  </div>
                </div>
              </template>

              <!-- Contract template selector. -->
              <div
                class="entity-modal-backdrop"
                x-show="contractTemplateModalOpen"
                x-cloak
                role="dialog"
                aria-modal="true"
                aria-labelledby="contract-template-title"
                @click.self="closeContractTemplateModal()"
                @keydown.escape.window="closeContractTemplateModal()"
              >
                  <div class="template-modal" @click.stop>
                    <div class="template-modal__header">
                      <div>
                        <div class="entity-modal__kicker" x-text="t('editor.templates.contracts')"></div>
                        <div id="contract-template-title" class="template-modal__title" x-text="t('editor.templates.contractChoice')"></div>
                      </div>
                      <button type="button" class="entity-modal__close" @click="closeContractTemplateModal()" x-text="t('common.close')"></button>
                    </div>
                    <div class="template-modal__list">
                      <template x-for="template in contractTemplates" :key="template.id">
                        <button type="button" class="template-option" @click="loadContractTemplate(template)">
                          <span class="template-option__title" x-text="template.name"></span>
                          <span class="template-option__description" x-text="t('editor.templates.contractDescription')"></span>
                          <span class="template-option__file" x-text="template.fileName"></span>
                        </button>
                      </template>
                    </div>
                  </div>
              </div>

              <!-- Table removal confirmation: protects completed schema definitions. -->
              <template x-if="removeTableModalOpen">
                <div
                  class="entity-modal-backdrop"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="remove-table-title"
                  @click.self="closeRemoveTableModal()"
                  @keydown.escape.window="closeRemoveTableModal()"
                >
                  <div class="reset-modal" @click.stop>
                    <div class="reset-modal__header">
                      <div>
                        <div class="entity-modal__kicker" x-text="schemaCollection.length === 1 ? t('editor.removeTable.clearKicker') : t('editor.removeTable.kicker')"></div>
                        <div id="remove-table-title" class="reset-modal__title" x-text="schemaCollection.length === 1 ? t('editor.removeTable.clearQuestion') : t('editor.removeTable.question')"></div>
                      </div>
                    </div>
                    <div class="reset-modal__body">
                      <p x-text="t(schemaCollection.length === 1 ? 'editor.removeTable.clearBody' : 'editor.removeTable.body', { name: schemaDraft.tableName || t('editor.removeTable.unnamed') })"></p>
                    </div>
                    <div class="reset-modal__footer">
                      <div></div>
                      <div class="reset-modal__actions">
                        <button type="button" class="pine-btn" @click="closeRemoveTableModal()" x-text="t('common.cancel')"></button>
                        <button type="button" class="reset-modal__danger" @click="confirmRemoveTable()" x-text="t(schemaCollection.length === 1 ? 'editor.removeTable.clearConfirm' : 'editor.removeTable.confirm')"></button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>

              <!-- Reset confirmation: removes only the contract draft. -->
              <template x-if="resetContractModalOpen">
                <div
                  class="entity-modal-backdrop"
                  role="dialog"
                  aria-modal="true"
                  aria-labelledby="reset-contract-title"
                  @click.self="closeResetContractModal()"
                  @keydown.escape.window="closeResetContractModal()"
                >
                  <div class="reset-modal" @click.stop>
                    <div class="reset-modal__header">
                      <div>
                        <div class="entity-modal__kicker" x-text="t('editor.reset.title')"></div>
                        <div id="reset-contract-title" class="reset-modal__title" x-text="t('editor.reset.question')"></div>
                      </div>
                    </div>
                    <div class="reset-modal__body">
                      <p x-text="t('editor.reset.body')"></p>
                    </div>
                    <div class="reset-modal__footer">
                      <button type="button" class="pine-btn" @click="downloadYaml()" :disabled="!yamlText.trim()" x-text="t('editor.reset.download')"></button>
                      <div class="reset-modal__actions">
                        <button type="button" class="pine-btn" @click="closeResetContractModal()" x-text="t('common.cancel')"></button>
                        <button type="button" class="reset-modal__danger" @click="resetContractDraft()" x-text="t('editor.reset.confirm')"></button>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </section>
