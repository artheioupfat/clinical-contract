            <!-- Right panel: independent dataset loading, preview, schema, and quality checks. -->
            <section class="panel" x-show="!checkerCollapsed" x-cloak>
              <div class="panel-head">
                <div class="checker-head-title">
                  <button
                    type="button"
                    class="checker-collapse-btn"
                    @click.stop="toggleCheckerPanel()"
                    aria-label="Hide checker panel"
                    title="Hide checker panel"
                  >
                    <svg class="checker-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
                    </svg>
                  </button>
                  <div>
                    <div class="panel-eyebrow">Checker</div>
                    <div class="panel-title" x-text="dataFileName || 'No data file loaded'"></div>
                  </div>
                </div>
                <div class="pine-toolbar">
                  <div class="view-switch" :class="!dataFile ? 'view-switch--locked' : ''" :title="!dataFile ? 'Load a data file to unlock' : ''">
                    <button type="button" :class="dataModeButtonClass('data')" @click="dataTab = 'data'" :disabled="!dataFile">Data</button>
                    <button type="button" :class="dataModeButtonClass('schema')" @click="dataTab = 'schema'" :disabled="!dataFile">
                      <span class="view-switch-label">
                        <span class="tab-dot" :class="tabDotClass(schemaRunState)"></span>
                        <span>Schema</span>
                      </span>
                    </button>
                    <button type="button" :class="dataModeButtonClass('quality')" @click="dataTab = 'quality'" :disabled="!dataFile">
                      <span class="view-switch-label">
                        <span class="tab-dot" :class="tabDotClass(qualityRunState)"></span>
                        <span>Quality</span>
                      </span>
                    </button>
                  </div>
                  <input x-ref="dataInput" type="file" class="sr-only" accept=".parquet,.csv" @change="pickDataFile($event)" />
                  <button
                    type="button"
                    x-show="dataFile"
                    x-cloak
                    @click="deleteDataFile()"
                    :disabled="busy || previewLoading"
                    class="pine-btn pine-btn--danger pine-btn--icon"
                    aria-label="Delete data file"
                    title="Delete data file?"
                  >
                    <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7" />
                    </svg>
                  </button>
                  <button
                    type="button"
                    @click="runCheck()"
                    :disabled="busy || !pythonReady || !schemaStarted || !dataFile"
                    class="pine-btn pine-btn--action-success"
                    :title="!schemaStarted ? 'Create or load a contract first' : !dataFile ? 'Load a data file first' : 'Run schema and quality checks'"
                  >Run checks</button>
                </div>
              </div>

              <!-- Data view: upload first, then render the paginated DuckDB preview. -->
              <div class="results-table-wrap results-table-wrap--preview" x-show="dataTab === 'data'" x-cloak>
                    <div class="data-warning" x-show="dataStorageWarning" x-cloak x-text="dataStorageWarning"></div>

                    <template x-if="!dataFile">
                      <div
                        class="workspace-empty workspace-empty--data"
                        :class="draggingData ? 'workspace-empty--active' : ''"
                        @dragenter.prevent="draggingData = true"
                        @dragover.prevent="draggingData = true"
                        @dragleave.prevent="draggingData = false"
                        @drop.prevent="dropData($event)"
                      >
                        <div class="workspace-empty-card">
                          <div class="workspace-empty-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5C4 5.57 7.58 4 12 4s8 1.57 8 3.5S16.42 11 12 11 4 9.43 4 7.5Z" />
                              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5v4c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5v-4M4 11.5v4C4 17.43 7.58 19 12 19s8-1.57 8-3.5v-4" />
                            </svg>
                          </div>
                          <h2 class="workspace-empty-title">Drop a data file</h2>
                          <p class="workspace-empty-copy">Load a CSV or Parquet file to check its compliance with a data contract.</p>
                          <div class="workspace-empty-actions">
                            <button type="button" class="pine-btn pine-btn--primary" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="$refs.dataInput.click()">Load data</button>
                          </div>
                          <button type="button" class="workspace-template-link" :disabled="!pythonReady" @click="openDataTemplateModal()">Show examples</button>
                        </div>
                      </div>
                    </template>

                    <template x-if="dataFile">
                      <div class="preview-layout">
                        <div class="preview-scroll">
                          <table class="preview-table">
                            <thead>
                              <tr>
                                <template x-if="previewColumns.length === 0">
                                  <th class="preview-th preview-th--single">Data preview</th>
                                </template>
                                <template x-for="(columnName, idx) in previewColumns" :key="`preview-col-${idx}`">
                                  <th class="preview-th" :class="idx === 0 ? 'preview-th--first' : ''" :title="columnName" x-text="columnName"></th>
                                </template>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-if="previewLoading">
                                <tr><td class="preview-empty" :colspan="Math.max(1, previewColumns.length)">Loading preview page...</td></tr>
                              </template>
                              <template x-if="!previewLoading && previewError">
                                <tr><td class="preview-empty preview-empty--error" :colspan="Math.max(1, previewColumns.length)" x-text="previewError"></td></tr>
                              </template>
                              <template x-if="!previewLoading && !previewError && previewRows.length === 0">
                                <tr><td class="preview-empty" :colspan="Math.max(1, previewColumns.length)">No preview rows available.</td></tr>
                              </template>
                              <template x-for="(row, rowIdx) in previewRows" :key="`preview-row-${rowIdx}`">
                                <tr>
                                  <template x-for="(cell, cellIdx) in row" :key="`preview-cell-${rowIdx}-${cellIdx}`">
                                    <td class="preview-td" :class="cellIdx === 0 ? 'preview-td--first' : ''">
                                      <div class="preview-cell" :title="cell === null ? 'null' : String(cell)" x-text="cell === null ? 'null' : String(cell)"></div>
                                    </td>
                                  </template>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <div class="preview-pagination" x-show="!previewError" x-cloak>
                          <p class="preview-pagination__meta">
                            Showing <span x-text="previewStartRow"></span> to <span x-text="previewEndRow"></span> of <span x-text="previewTotalRows"></span> results
                          </p>
                          <nav aria-label="Dataset preview pages">
                            <ul class="pager">
                              <li><button type="button" class="pager-btn" @click="goPreviewPrev()" :disabled="previewLoading || previewPage <= 1 || previewTotalPages === 0">Previous</button></li>
                              <template x-for="(item, idx) in previewPageItems" :key="`preview-page-${idx}-${item}`">
                                <li class="pager-item--desktop">
                                  <template x-if="item === 'ellipsis'"><span class="pager-ellipsis">...</span></template>
                                  <template x-if="item !== 'ellipsis'">
                                    <button type="button" class="pager-btn" :class="Number(item) === previewPage ? 'pager-btn--active' : ''" @click="loadPreviewPage(Number(item))" :disabled="previewLoading" x-text="item"></button>
                                  </template>
                                </li>
                              </template>
                              <li><button type="button" class="pager-btn" @click="goPreviewNext()" :disabled="previewLoading || previewPage >= previewTotalPages || previewTotalPages === 0">Next</button></li>
                            </ul>
                          </nav>
                        </div>
                      </div>
                    </template>
              </div>

              <div class="results-table-wrap" x-show="dataTab === 'schema'" x-cloak>
                    <table class="results-table">
                      <thead><tr><th>Schema</th><th>Column</th><th>Required</th><th>Expected</th><th>Detected</th><th>Status</th></tr></thead>
                      <tbody>
                        <template x-if="schemaRows.length === 0"><tr><td colspan="6" class="empty-row">No schema result yet.</td></tr></template>
                        <template x-for="(row, idx) in schemaRows" :key="`${row.schema_name}-${row.column}-${idx}`">
                          <tr>
                            <td x-text="row.schema_name"></td>
                            <td x-text="row.column"></td>
                            <td x-text="row.required === true ? 'true' : row.required === false ? 'false' : 'missing'"></td>
                            <td x-text="row.yaml_type"></td>
                            <td x-text="row.parquet_type"></td>
                            <td><span class="status-chip" :class="statusChipClass(row.status)"><span class="status-dot" :class="statusDotClass(row.status)"></span><span x-text="row.status"></span></span></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
              </div>

              <div class="results-table-wrap" x-show="dataTab === 'quality'" x-cloak>
                    <table class="results-table">
                      <thead><tr><th>Schema</th><th>Column</th><th>Rule</th><th>Obtained</th><th>Expected</th><th>Result</th><th>Log</th></tr></thead>
                      <tbody>
                        <template x-if="qualityRows.length === 0"><tr><td colspan="7" class="empty-row">No quality result yet.</td></tr></template>
                        <template x-for="(row, idx) in qualityRows" :key="`${row.property_name}-${idx}`">
                          <tr>
                            <td x-text="row.schema_name"></td>
                            <td x-text="row.property_name"></td>
                            <td x-text="row.description"></td>
                            <td x-text="row.obtained"></td>
                            <td x-text="row.expected"></td>
                            <td><span class="status-chip" :class="statusChipClass(row.status)"><span class="status-dot" :class="statusDotClass(row.status)"></span><span x-text="row.status"></span></span></td>
                            <td class="quality-result-log" :class="row.log ? 'quality-result-log--error' : ''" x-text="row.log || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
              </div>

              <!-- Dataset template selector. -->
              <div
                class="entity-modal-backdrop"
                x-show="dataTemplateModalOpen"
                x-cloak
                role="dialog"
                aria-modal="true"
                aria-labelledby="data-template-title"
                @click.self="closeDataTemplateModal()"
                @keydown.escape.window="closeDataTemplateModal()"
              >
                  <div class="template-modal" @click.stop>
                    <div class="template-modal__header">
                      <div>
                        <div class="entity-modal__kicker">Sample datasets</div>
                        <div id="data-template-title" class="template-modal__title">Choose a local example</div>
                      </div>
                      <button type="button" class="entity-modal__close" @click="closeDataTemplateModal()">Close</button>
                    </div>
                    <div class="template-modal__list">
                      <template x-for="template in dataTemplates" :key="template.id">
                        <button type="button" class="template-option" @click="loadDataTemplate(template)">
                          <span class="template-option__title" x-text="template.name"></span>
                          <span class="template-option__description" x-text="template.description"></span>
                          <span class="template-option__file" x-text="template.fileName"></span>
                        </button>
                      </template>
                    </div>
                  </div>
              </div>
            </section>
