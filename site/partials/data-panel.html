            <!-- Right panel: independent dataset loading, preview, schema, and quality checks. -->
            <section class="panel" x-show="!checkerCollapsed" x-cloak @dragover.prevent @drop.prevent="dropData($event)">
              <div class="panel-head">
                <div class="checker-head-title">
                  <button
                    type="button"
                    class="checker-collapse-btn"
                    @click.stop="toggleCheckerPanel()"
                    :aria-label="t('editor.resize.hide')"
                    :title="t('editor.resize.hide')"
                  >
                    <svg class="checker-toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6" />
                    </svg>
                  </button>
                  <div class="panel-eyebrow" x-text="t('editor.panel.checker')"></div>
                </div>
                <div class="pine-toolbar">
                  <div class="view-switch" :class="!dataFile ? 'view-switch--locked' : ''" :title="!dataFile ? t('editor.panel.unlockData') : ''">
                    <button type="button" :class="dataModeButtonClass('data')" @click="dataTab = 'data'" :disabled="!dataFile" x-text="t('editor.tabs.data')"></button>
                    <button type="button" :class="dataModeButtonClass('schema')" @click="dataTab = 'schema'" :disabled="!dataFile">
                      <span class="view-switch-label">
                        <span class="tab-dot" :class="tabDotClass(schemaRunState)"></span>
                        <span x-text="t('editor.tabs.schema')"></span>
                      </span>
                    </button>
                    <button type="button" :class="dataModeButtonClass('quality')" @click="dataTab = 'quality'" :disabled="!dataFile">
                      <span class="view-switch-label">
                        <span class="tab-dot" :class="tabDotClass(qualityRunState)"></span>
                        <span x-text="t('editor.tabs.quality')"></span>
                      </span>
                    </button>
                  </div>
                  <button
                    type="button"
                    @click="runCheck()"
                    :disabled="busy || !pythonReady || !schemaStarted || !dataFile"
                    class="pine-btn pine-btn--action-success"
                    :title="!schemaStarted ? t('editor.actions.contractFirst') : !dataFile ? t('editor.actions.dataFirst') : t('editor.actions.runChecksTitle')"
                    x-text="t('editor.actions.runChecks')"
                  ></button>
                </div>
              </div>

              <input x-ref="dataInput" type="file" class="sr-only" accept=".parquet,.csv" multiple @change="pickDataFile($event)" />

              <div class="entity-tabs-toolbar data-file-toolbar" x-show="dataTab === 'data' && dataFile" x-cloak>
                <div class="entity-tabs-controls">
                  <div class="entity-tabs-list" role="group" :aria-label="t('editor.panel.dataFiles')">
                    <template x-for="(file, index) in dataFiles" :key="`${file.name}-${index}`">
                      <button
                        type="button"
                        class="entity-tab"
                        :class="{ 'entity-tab--active': index === activeDataIndex }"
                        :aria-pressed="index === activeDataIndex"
                        :title="file.name"
                        @click="selectDataFile(index)"
                        x-text="file.name"
                      ></button>
                    </template>
                  </div>
                  <div class="entity-tabs-actions">
                    <button
                      type="button"
                      @click="$refs.dataInput.click()"
                      class="pine-btn pine-btn--icon"
                      :aria-label="t('editor.actions.addData')"
                      :title="t('editor.actions.addData')"
                    >
                      <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                      </svg>
                    </button>
                    <button
                      type="button"
                      @click="deleteDataFile()"
                      :disabled="busy || previewLoading"
                      class="pine-btn pine-btn--danger pine-btn--icon"
                      :aria-label="t('editor.actions.deleteData')"
                      :title="t('editor.actions.deleteDataQuestion')"
                    >
                      <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7" />
                      </svg>
                    </button>
                  </div>
                </div>
              </div>

              <!-- Data view: upload first, then render the paginated DuckDB preview. -->
              <div class="results-table-wrap results-table-wrap--preview" x-show="dataTab === 'data'" x-cloak>
                    <div class="data-warning" x-show="dataStorageWarning" x-cloak x-text="dataStorageWarning"></div>

                    <template x-if="!dataFile">
                      <div
                        class="workspace-empty workspace-empty--data"
                        :class="draggingData ? 'workspace-empty--active' : ''"
                        @dragenter.prevent="draggingData = true"
                        @dragover.prevent="draggingData = true"
                        @dragleave.prevent="draggingData = false"
                        @drop.prevent.stop="dropData($event)"
                      >
                        <div class="workspace-empty-card">
                          <div class="workspace-empty-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5C4 5.57 7.58 4 12 4s8 1.57 8 3.5S16.42 11 12 11 4 9.43 4 7.5Z" />
                              <path stroke-linecap="round" stroke-linejoin="round" d="M4 7.5v4c0 1.93 3.58 3.5 8 3.5s8-1.57 8-3.5v-4M4 11.5v4C4 17.43 7.58 19 12 19s8-1.57 8-3.5v-4" />
                            </svg>
                          </div>
                          <h2 class="workspace-empty-title" x-text="t('editor.emptyData.title')"></h2>
                          <p class="workspace-empty-copy" x-text="t('editor.emptyData.body')"></p>
                          <div class="workspace-empty-actions">
                            <button type="button" class="pine-btn pine-btn--primary" :disabled="!pythonReady" :class="!pythonReady ? 'pine-btn--locked' : ''" @click="$refs.dataInput.click()" x-text="t('editor.actions.loadData')"></button>
                          </div>
                          <button type="button" class="workspace-template-link" :disabled="!pythonReady" @click="openDataTemplateModal()" x-text="t('editor.actions.showExamples')"></button>
                        </div>
                      </div>
                    </template>

                    <template x-if="dataFile">
                      <div class="preview-layout">
                        <div class="preview-scroll">
                          <table class="preview-table">
                            <thead>
                              <tr>
                                <template x-if="previewColumns.length === 0">
                                  <th class="preview-th preview-th--single" x-text="t('editor.preview.title')"></th>
                                </template>
                                <template x-for="(columnName, idx) in previewColumns" :key="`preview-col-${idx}`">
                                  <th class="preview-th" :class="idx === 0 ? 'preview-th--first' : ''" :title="columnName" x-text="columnName"></th>
                                </template>
                              </tr>
                            </thead>
                            <tbody>
                              <template x-if="previewLoading">
                                <tr><td class="preview-empty" :colspan="Math.max(1, previewColumns.length)" x-text="t('editor.preview.loading')"></td></tr>
                              </template>
                              <template x-if="!previewLoading && previewError">
                                <tr><td class="preview-empty preview-empty--error" :colspan="Math.max(1, previewColumns.length)" x-text="previewError"></td></tr>
                              </template>
                              <template x-if="!previewLoading && !previewError && previewRows.length === 0">
                                <tr><td class="preview-empty" :colspan="Math.max(1, previewColumns.length)" x-text="t('editor.preview.empty')"></td></tr>
                              </template>
                              <template x-for="(row, rowIdx) in previewRows" :key="`preview-row-${rowIdx}`">
                                <tr>
                                  <template x-for="(cell, cellIdx) in row" :key="`preview-cell-${rowIdx}-${cellIdx}`">
                                    <td class="preview-td" :class="cellIdx === 0 ? 'preview-td--first' : ''">
                                      <div class="preview-cell" :title="cell === null ? 'null' : String(cell)" x-text="cell === null ? 'null' : String(cell)"></div>
                                    </td>
                                  </template>
                                </tr>
                              </template>
                            </tbody>
                          </table>
                        </div>
                        <div class="preview-pagination" x-show="!previewError" x-cloak>
                          <p class="preview-pagination__meta" x-text="t('editor.preview.showing', { start: previewStartRow, end: previewEndRow, total: previewTotalRows })"></p>
                          <nav :aria-label="t('editor.preview.pages')">
                            <ul class="pager">
                              <li><button type="button" class="pager-btn" @click="goPreviewPrev()" :disabled="previewLoading || previewPage <= 1 || previewTotalPages === 0" x-text="t('editor.preview.previous')"></button></li>
                              <template x-for="(item, idx) in previewPageItems" :key="`preview-page-${idx}-${item}`">
                                <li class="pager-item--desktop">
                                  <template x-if="item === 'ellipsis'"><span class="pager-ellipsis">...</span></template>
                                  <template x-if="item !== 'ellipsis'">
                                    <button type="button" class="pager-btn" :class="Number(item) === previewPage ? 'pager-btn--active' : ''" @click="loadPreviewPage(Number(item))" :disabled="previewLoading" x-text="item"></button>
                                  </template>
                                </li>
                              </template>
                              <li><button type="button" class="pager-btn" @click="goPreviewNext()" :disabled="previewLoading || previewPage >= previewTotalPages || previewTotalPages === 0" x-text="t('editor.preview.next')"></button></li>
                            </ul>
                          </nav>
                        </div>
                      </div>
                    </template>
              </div>

              <div class="results-table-wrap results-table-wrap--checker-results" x-show="dataTab === 'schema'" x-cloak>
                    <table class="results-table">
                      <thead><tr><th x-text="t('editor.schemaResults.schema')"></th><th x-text="t('editor.schemaResults.column')"></th><th x-text="t('editor.schemaResults.required')"></th><th x-text="t('editor.schemaResults.expected')"></th><th x-text="t('editor.schemaResults.detected')"></th><th x-text="t('editor.schemaResults.status')"></th></tr></thead>
                      <tbody>
                        <template x-if="schemaRows.length === 0"><tr><td colspan="6" class="empty-row" x-text="t('editor.schemaResults.empty')"></td></tr></template>
                        <template x-for="(row, idx) in schemaRows" :key="`${row.schema_name}-${row.column}-${idx}`">
                          <tr>
                            <td x-text="row.schema_name"></td>
                            <td x-text="row.column"></td>
                            <td x-text="row.required === true ? t('common.yes') : row.required === false ? t('common.no') : t('editor.schemaResults.missing')"></td>
                            <td x-text="row.yaml_type"></td>
                            <td x-text="row.parquet_type"></td>
                            <td><span class="status-chip" :class="statusChipClass(row.status)"><span class="status-dot" :class="statusDotClass(row.status)"></span><span x-text="resultStatusLabel(row.status)"></span></span></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
              </div>

              <div class="results-table-wrap results-table-wrap--checker-results" x-show="dataTab === 'quality'" x-cloak>
                    <table class="results-table">
                      <thead><tr><th x-text="t('editor.qualityResults.schema')"></th><th x-text="t('editor.qualityResults.column')"></th><th x-text="t('editor.qualityResults.rule')"></th><th x-text="t('editor.qualityResults.obtained')"></th><th x-text="t('editor.qualityResults.expected')"></th><th x-text="t('editor.qualityResults.result')"></th><th x-text="t('editor.qualityResults.log')"></th></tr></thead>
                      <tbody>
                        <template x-if="qualityRows.length === 0"><tr><td colspan="7" class="empty-row" x-text="t('editor.qualityResults.empty')"></td></tr></template>
                        <template x-for="(row, idx) in qualityRows" :key="`${row.property_name}-${idx}`">
                          <tr>
                            <td x-text="row.schema_name"></td>
                            <td x-text="row.property_name"></td>
                            <td x-text="row.description"></td>
                            <td x-text="row.obtained"></td>
                            <td x-text="row.expected"></td>
                            <td><span class="status-chip" :class="statusChipClass(row.status)"><span class="status-dot" :class="statusDotClass(row.status)"></span><span x-text="resultStatusLabel(row.status)"></span></span></td>
                            <td class="quality-result-log" :class="row.log ? 'quality-result-log--error' : ''" x-text="row.log || '—'"></td>
                          </tr>
                        </template>
                      </tbody>
                    </table>
              </div>

              <!-- Dataset template selector. -->
              <div
                class="entity-modal-backdrop"
                x-show="dataTemplateModalOpen"
                x-cloak
                role="dialog"
                aria-modal="true"
                aria-labelledby="data-template-title"
                @click.self="closeDataTemplateModal()"
                @keydown.escape.window="closeDataTemplateModal()"
              >
                  <div class="template-modal" @click.stop>
                    <div class="template-modal__header">
                      <div>
                        <div class="entity-modal__kicker" x-text="t('editor.templates.datasets')"></div>
                        <div id="data-template-title" class="template-modal__title" x-text="t('editor.templates.dataChoice')"></div>
                      </div>
                      <button type="button" class="entity-modal__close" @click="closeDataTemplateModal()" x-text="t('common.close')"></button>
                    </div>
                    <div class="template-modal__list">
                      <template x-for="template in dataTemplates" :key="template.id">
                        <button
                          type="button"
                          class="template-option template-option--selectable"
                          :class="isDataTemplateSelected(template.id) ? 'template-option--selected' : ''"
                          :aria-pressed="isDataTemplateSelected(template.id)"
                          @click="toggleDataTemplateSelection(template.id)"
                        >
                          <span class="template-option__content">
                            <span class="template-option__title" x-text="template.name"></span>
                            <span class="template-option__description" x-text="t('editor.templates.dataDescription', { format: (template.fileName.split('.').pop() || 'data').toUpperCase() })"></span>
                            <span class="template-option__file" x-text="template.fileName"></span>
                          </span>
                          <span class="template-option__check" :class="isDataTemplateSelected(template.id) ? 'template-option__check--selected' : ''" aria-hidden="true">
                            <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2">
                              <path stroke-linecap="round" stroke-linejoin="round" d="M5 10l3 3 7-7" />
                            </svg>
                          </span>
                        </button>
                      </template>
                    </div>
                    <div class="template-modal__footer">
                      <span class="template-modal__selection" x-text="t('editor.templates.selected', { count: selectedDataTemplateIds.length })"></span>
                      <div class="template-modal__actions">
                        <button type="button" class="pine-btn" @click="closeDataTemplateModal()" x-text="t('common.cancel')"></button>
                        <button
                          type="button"
                          class="pine-btn pine-btn--primary"
                          :disabled="selectedDataTemplateIds.length === 0 || busy"
                          @click="confirmDataTemplateSelection()"
                          x-text="t('editor.templates.select')"
                        ></button>
                      </div>
                    </div>
                  </div>
              </div>
            </section>
