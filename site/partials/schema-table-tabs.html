                          <!-- Shared table selector for schema-scoped builder sections. -->
                          <div
                            class="entity-tabs-toolbar entity-tabs-toolbar--inline schema-table-toolbar"
                            x-data="{ tableMenuOpen: false }"
                            @keydown.escape.stop="tableMenuOpen = false"
                          >
                            <div class="entity-tabs-controls schema-table-controls">
                              <span class="schema-table-label">
                                <span x-text="t('editor.columns.tables')"></span><span aria-hidden="true">&nbsp;:</span>
                              </span>
                              <div class="schema-table-select">
                                <button
                                  type="button"
                                  class="schema-table-trigger"
                                  @click="tableMenuOpen = !tableMenuOpen"
                                  :aria-expanded="tableMenuOpen"
                                  aria-haspopup="listbox"
                                >
                                  <span
                                    class="schema-table-trigger__label"
                                    x-text="schemaCollection[schemaActiveIndex]?.name || `${t('editor.columns.table')} ${schemaActiveIndex + 1}`"
                                  ></span>
                                  <svg class="schema-table-trigger__icon" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                                    <path fill-rule="evenodd" d="M5.22 7.22a.75.75 0 0 1 1.06 0L10 10.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 8.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd" />
                                  </svg>
                                </button>
                                <ul
                                  x-show="tableMenuOpen"
                                  x-cloak
                                  @click.outside="tableMenuOpen = false"
                                  x-transition:enter="transition ease-out duration-100"
                                  x-transition:enter-start="opacity-0 -translate-y-1"
                                  x-transition:enter-end="opacity-100 translate-y-0"
                                  x-transition:leave="transition ease-in duration-75"
                                  x-transition:leave-start="opacity-100 translate-y-0"
                                  x-transition:leave-end="opacity-0 -translate-y-1"
                                  class="schema-table-menu"
                                  role="listbox"
                                  :aria-label="t('editor.columns.tables')"
                                >
                                  <template x-for="(table, index) in schemaCollection" :key="`schema-table-option-${schemaSection}-${index}`">
                                    <li role="presentation">
                                      <button
                                        type="button"
                                        class="schema-table-option"
                                        role="option"
                                        :aria-selected="index === schemaActiveIndex"
                                        :class="{ 'schema-table-option--active': index === schemaActiveIndex }"
                                        @click.capture="tableMenuOpen = false"
                                        @click="selectSchemaTable(index)"
                                      >
                                        <svg
                                          class="schema-table-option__check"
                                          :class="{ 'schema-table-option__check--visible': index === schemaActiveIndex }"
                                          viewBox="0 0 24 24"
                                          fill="none"
                                          stroke="currentColor"
                                          stroke-width="2"
                                          aria-hidden="true"
                                        >
                                          <path stroke-linecap="round" stroke-linejoin="round" d="m5 12 4 4L19 6" />
                                        </svg>
                                        <span x-text="table.name || `${t('editor.columns.table')} ${index + 1}`"></span>
                                      </button>
                                    </li>
                                  </template>
                                </ul>
                              </div>
                              <div class="entity-tabs-actions">
                                <button
                                  type="button"
                                  class="pine-btn pine-btn--icon"
                                  @click.capture="tableMenuOpen = false"
                                  @click="addSchemaTable()"
                                  :aria-label="t('editor.columns.addTable')"
                                  :title="t('editor.columns.addTable')"
                                >
                                  <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path stroke-linecap="round" d="M12 5v14M5 12h14" />
                                  </svg>
                                </button>
                                <button
                                  type="button"
                                  class="pine-btn pine-btn--danger pine-btn--icon"
                                  @click.capture="tableMenuOpen = false"
                                  @click="openRemoveTableModal()"
                                  :aria-label="t('editor.columns.removeTable')"
                                  :title="t('editor.columns.removeTable')"
                                >
                                  <svg class="pine-btn__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16m-10 4v6m4-6v6M9 7l1-3h4l1 3m3 0-1 13H7L6 7" />
                                  </svg>
                                </button>
                              </div>
                            </div>
                          </div>
